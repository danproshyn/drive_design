<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/design-system-d7c4f46a-eddf-4874-af71-8ec2161374b2/styles.css">
  <style>body{margin:0;background:#fff}a{color:var(--red-600)}a:hover{color:var(--red-700)}</style>
</helmet>
<div style="max-width:1100px;margin:0 auto;padding:40px 24px;display:grid;gap:32px;font-family:var(--font-body, Onest, sans-serif);color:var(--ink-800)">
  <h1 class="t-display" style="margin:0;font-family:Oswald, sans-serif;text-transform:uppercase;font-size:40px;line-height:1.05">Логотип у шапці й футері</h1>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px">
    <div style="display:grid;gap:12px;align-content:start">
      <p style="margin:0;font-weight:600">A · Повний <span style="font-weight:400;color:#726C64">logo-v2.svg</span></p>
      <div style="display:grid;gap:16px;padding:20px;border:1px solid #DCD8D2;border-radius:12px;justify-items:start">
        <img src="assets/logo-v2.svg" alt="Драйв" style="height:30px;width:auto">
        <img src="assets/logo-v2.svg" alt="Драйв" style="height:34px;width:auto">
        <img src="assets/logo-v2.svg" alt="Драйв" style="height:44px;width:auto">
      </div>
      <div style="display:grid;gap:16px;padding:20px;border-radius:12px;background:#24211D;justify-items:start">
        <img src="assets/logo-v2-dark.svg" alt="Драйв" style="height:34px;width:auto">
      </div>
    </div>
    <div style="display:grid;gap:12px;align-content:start">
      <p style="margin:0;font-weight:600">B2 · Ближче до A, зараз у шапці <span style="font-weight:400;color:#726C64">logo-v2-md2.svg</span></p>
      <div style="display:grid;gap:16px;padding:20px;border:1px solid #DCD8D2;border-radius:12px;justify-items:start">
        <img src="assets/logo-v2-md2.svg" alt="Драйв" style="height:30px;width:auto">
        <img src="assets/logo-v2-md2.svg" alt="Драйв" style="height:34px;width:auto">
        <img src="assets/logo-v2-md2.svg" alt="Драйв" style="height:44px;width:auto">
      </div>
      <div style="display:grid;gap:16px;padding:20px;border-radius:12px;background:#24211D;justify-items:start">
        <img src="assets/logo-v2-dark-md2.svg" alt="Драйв" style="height:34px;width:auto">
      </div>
    </div>
    <div style="display:grid;gap:12px;align-content:start">
      <p style="margin:0;font-weight:600">B · Середній <span style="font-weight:400;color:#726C64">logo-v2-md.svg</span></p>
      <div style="display:grid;gap:16px;padding:20px;border:1px solid #DCD8D2;border-radius:12px;justify-items:start">
        <img src="assets/logo-v2-md.svg" alt="Драйв" style="height:30px;width:auto">
        <img src="assets/logo-v2-md.svg" alt="Драйв" style="height:34px;width:auto">
        <img src="assets/logo-v2-md.svg" alt="Драйв" style="height:44px;width:auto">
      </div>
      <div style="display:grid;gap:16px;padding:20px;border-radius:12px;background:#24211D;justify-items:start">
        <img src="assets/logo-v2-dark-md.svg" alt="Драйв" style="height:34px;width:auto">
      </div>
    </div>
    <div style="display:grid;gap:12px;align-content:start">
      <p style="margin:0;font-weight:600">C · Спрощений <span style="font-weight:400;color:#726C64">logo-v2-sm.svg</span></p>
      <div style="display:grid;gap:16px;padding:20px;border:1px solid #DCD8D2;border-radius:12px;justify-items:start">
        <img src="assets/logo-v2-sm.svg" alt="Драйв" style="height:30px;width:auto">
        <img src="assets/logo-v2-sm.svg" alt="Драйв" style="height:34px;width:auto">
        <img src="assets/logo-v2-sm.svg" alt="Драйв" style="height:44px;width:auto">
      </div>
      <div style="display:grid;gap:16px;padding:20px;border-radius:12px;background:#24211D;justify-items:start">
        <img src="assets/logo-v2-dark-sm.svg" alt="Драйв" style="height:34px;width:auto">
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
